version: "3.9"

# ── MedAI Docker Compose ────────────────────────────────────────────────────
# Works on Windows (Docker Desktop), Linux, and macOS.
# GPU passthrough is optional — remove the 'deploy' block if you don't have
# an NVIDIA GPU or nvidia-container-toolkit installed.
#
# Quick start:
#   1. cp .env.example .env  and fill in values
#   2. docker compose up -d
#   3. docker exec medai-ollama-1 ollama pull llama3.2:3b
#   4. docker exec medai-ollama-1 ollama pull nomic-embed-text
#   5. Open http://localhost:8080
# ────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medai
      POSTGRES_USER: medai
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama LLM ─────────────────────────────────────────────
  # After first `docker compose up -d`, pull models once:
  #   docker exec medai-ollama-1 ollama pull llama3.2:3b
  #   docker exec medai-ollama-1 ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # ── Optional NVIDIA GPU (remove if no GPU / Windows without CUDA) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Python ML service ──────────────────────────────────────
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    volumes:
      # Model files mounted read-only — already in the repo, no download needed
      - ./ml_service/lung_cancer_model.pt:/app/lung_cancer_model.pt:ro
      - ./ml_service/blood_cancer_model.pt:/app/blood_cancer_model.pt:ro
      - ./ml_service/kidney_cancer_cyst_stone_model.pt:/app/kidney_cancer_cyst_stone_model.pt:ro
      - ./ml_service/skin_cancer_model.pt:/app/skin_cancer_model.pt:ro
      - ./ml_service/runs:/app/runs:ro
      - ./ml_service/run_ml_models:/app/run_ml_models:ro
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Spring Boot backend + frontend ─────────────────────────
  spring-boot:
    build:
      context: .
      dockerfile: Dockerfile.spring
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/medai
      - SPRING_DATASOURCE_USERNAME=medai
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - APP_ML_SERVICE_BASE_URL=http://ml-service:5001
      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_EXPIRATION=86400000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  ollama_data:
