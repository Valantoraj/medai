version: "3.9"

# ── MedAI — Pull from Docker Hub (no build needed) ─────────────────────────
# This is the file to use on your personal/remote machine.
# Prerequisites: Docker Desktop installed and running. That's it.
#
# First time setup (run once):
#   1. docker compose -f docker-compose.hub.yml up -d
#   2. docker exec medai-ollama-1 ollama pull llama3.2:3b
#   3. docker exec medai-ollama-1 ollama pull nomic-embed-text
#   4. Open http://localhost:8090
#
# Every time after:
#   docker compose -f docker-compose.hub.yml up -d
# ────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medai
      POSTGRES_USER: medai
      POSTGRES_PASSWORD: medai_secure_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama is NOT containerised here ──────────────────────
  # Ollama is already installed natively on Windows and running on
  # localhost:11434. Docker containers reach the Windows host via
  # host.docker.internal. No Ollama container needed.
  #
  # Make sure these models are pulled on the Windows machine:
  #   ollama pull llama3.2:3b
  #   ollama pull nomic-embed-text

  ml-service:
    image: valantorajg/medai-ml:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGIN=http://localhost:8090
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  spring-boot:
    image: valantorajg/medai-app:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/medai
      - SPRING_DATASOURCE_USERNAME=medai
      - SPRING_DATASOURCE_PASSWORD=medai_secure_2024
      # host.docker.internal resolves to the Windows host IP from inside Docker
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - APP_ML_SERVICE_BASE_URL=http://ml-service:5001
      - APP_JWT_SECRET=change_this_to_a_random_64_char_string
      - APP_JWT_EXPIRATION=86400000
      - ALLOWED_ORIGIN=http://localhost:8090
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

volumes:
  pgdata:
