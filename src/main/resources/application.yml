spring:
  application:
    name: medai

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          temperature: 0.7
          num-predict: 1024
      embedding:
        options:
          model: nomic-embed-text:latest

  datasource:
    url: jdbc:postgresql://localhost:5432/medai
    username: medai
    password: medai_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 3600

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: 4d6e7a3b9f2c1e8a5d0f7b4c2e9a6d3f1b8e5c2a9f7d4b1e8c5a2f9d6b3e0a7
    expiration: 86400000

  ollama:
    models:
      mental-health: medllama2
      common-disease: medllama2
      complex-disease: meditron
      medicine: qwen3-coder:latest
      embedding: nomic-embed-text:latest
      fallback: llama3.1:8b
      guidance: qwen3-coder:latest

  confidence:
    threshold-common: 80
    threshold-complex: 85
    threshold-mental: 80

  ml-service:
    base-url: http://localhost:5001

logging:
  level:
    com.medai: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
