spring:
  application:
    name: medai

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          temperature: 0.7
          num-predict: 1024
      embedding:
        options:
          model: nomic-embed-text:latest

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medai}
    username: ${SPRING_DATASOURCE_USERNAME:medai}
    password: ${SPRING_DATASOURCE_PASSWORD:medai_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 86400
        cachecontrol:
          max-age: 86400
          must-revalidate: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${APP_JWT_SECRET:4d6e7a3b9f2c1e8a5d0f7b4c2e9a6d3f1b8e5c2a9f7d4b1e8c5a2f9d6b3e0a7}
    expiration: ${APP_JWT_EXPIRATION:86400000}

  ollama:
    models:
      mental-health: llama3.2:3b
      common-disease: llama3.2:3b
      complex-disease: llama3.2:3b
      medicine: llama3.2:3b
      embedding: nomic-embed-text:latest
      fallback: llama3.2:3b
      guidance: llama3.2:3b

  confidence:
    threshold-common: 80
    threshold-complex: 85
    threshold-mental: 80

  ml-service:
    base-url: ${APP_ML_SERVICE_BASE_URL:http://localhost:5001}

logging:
  level:
    com.medai: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
