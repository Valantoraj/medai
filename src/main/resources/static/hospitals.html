<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MedAI — Nearby Hospitals</title>
  <link rel="stylesheet" href="/css/base.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
  <link rel="stylesheet" href="/css/map.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="/index.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span class="gradient-text">MedAI</span>
  </a>
  <div class="navbar-links">
    <a class="nav-link" href="/chat.html">🤖 Chatbots</a>
    <a class="nav-link" href="/medicine.html">💊 Medicine</a>
    <a class="nav-link" href="/predict.html">📊 Predict</a>
    <a class="nav-link" href="/predict-image.html">🔬 Scan</a>
    <a class="nav-link active" href="/hospitals.html">🏥 Hospitals</a>
    <a class="nav-link" href="/dashboard.html">📈 Dashboard</a>
  </div>
  <div class="navbar-right">
    <button class="personalisation-toggle" id="personalisation-toggle">
      <span class="dot"></span><span class="toggle-label">General</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="logout-btn">Sign Out</button>
    <button class="btn btn-ghost btn-icon" id="theme-toggle">☀️</button>
  </div>
</nav>

<!-- Urgency banner (shown when triggered from chatbot) -->
<div id="urgency-banner" class="urgency-banner" style="display:none;">
  🚨 <span id="urgency-text">Based on your symptoms, we recommend visiting a hospital immediately. Here are the nearest ones:</span>
</div>

<div class="map-layout">
  <!-- Hospital sidebar -->
  <aside class="hospital-sidebar">
    <div class="hospital-sidebar-header">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <h3 style="font-size:14px;font-weight:700;">🏥 Nearby Hospitals</h3>
        <span id="hospital-count" style="font-size:11px;color:var(--text-muted);"></span>
      </div>
      <div class="hospital-search">
        <input class="form-input" type="text" id="hospital-search" placeholder="Filter hospitals…"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <select class="form-input" id="radius-select" style="font-size:12px;padding:5px 8px;flex:1;">
          <option value="2000">2 km</option>
          <option value="5000" selected>5 km</option>
          <option value="10000">10 km</option>
          <option value="20000">20 km</option>
        </select>
        <button class="btn btn-sm btn-primary" onclick="reloadHospitals()">Search</button>
      </div>
    </div>
    <div class="hospital-list" id="hospital-list">
      <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">
        <div class="map-spinner" style="margin:0 auto 12px;"></div>
        Detecting your location…
      </div>
    </div>
  </aside>

  <!-- Map -->
  <div style="position:relative;">
    <div id="map-loading" class="map-loading">
      <div class="map-spinner"></div>
      <span>Getting your location…</span>
    </div>
    <div id="map"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="/js/app.js"></script>
<script src="/js/hospitals.js"></script>
</body>
</html>
