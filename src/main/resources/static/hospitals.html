<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MedAI — Nearby Hospitals</title>
  <link rel="stylesheet" href="/css/base.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
  <link rel="stylesheet" href="/css/map.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="/index.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span class="gradient-text">MedAI</span>
  </a>
  <div class="navbar-links">
    <a class="nav-link" href="/dashboard.html" style="display:inline-flex;align-items:center;gap:5px;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg> Dashboard</a>
    <a class="nav-link" href="/chat.html" style="display:inline-flex;align-items:center;gap:5px;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="10" x="3" y="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg> Chatbots</a>
    <a class="nav-link" href="/medicine.html" style="display:inline-flex;align-items:center;gap:5px;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg> Medicine</a>
    <a class="nav-link" href="/predict.html" style="display:inline-flex;align-items:center;gap:5px;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg> Predict</a>
    <a class="nav-link" href="/predict-image.html" style="display:inline-flex;align-items:center;gap:5px;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg> Scan</a>
    <a class="nav-link active" href="/hospitals.html" style="display:inline-flex;align-items:center;gap:5px;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v4"/><path d="M14 14h-4"/><path d="M14 18h-4"/><path d="M14 8h-4"/><path d="M18 12h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2"/><path d="M18 22V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v18"/></svg> Hospitals</a>  </div>
  <div class="navbar-right">
    <button class="personalisation-toggle" id="personalisation-toggle">
      <span class="dot"></span><span class="toggle-label">General</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="logout-btn">Sign Out</button>
    <button class="btn btn-ghost btn-icon" id="theme-toggle"></button>
  </div>
</nav>

<!-- Urgency banner -->
<div id="urgency-banner" class="urgency-banner" style="display:none;">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l-1.27 8.77L12 22l11.27-6.23L22 7Z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
  <span id="urgency-text">Based on your symptoms, we recommend visiting a hospital immediately. Here are the nearest ones:</span>
</div>

<div class="map-layout">
  <!-- Hospital sidebar -->
  <aside class="hospital-sidebar">
    <div class="hospital-sidebar-header">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <h3 style="font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v4"/><path d="M14 14h-4"/><path d="M14 18h-4"/><path d="M14 8h-4"/><path d="M18 12h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2"/><path d="M18 22V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v18"/></svg>
          Nearby Hospitals
        </h3>
        <span id="hospital-count" style="font-size:11px;color:var(--text-muted);"></span>
      </div>
      <div class="hospital-search">
        <input class="form-input" type="text" id="hospital-search" placeholder="Filter hospitals…"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <select class="form-input" id="radius-select" style="font-size:12px;padding:5px 8px;flex:1;">
          <option value="2000">2 km</option>
          <option value="5000" selected>5 km</option>
          <option value="10000">10 km</option>
          <option value="20000">20 km</option>
        </select>
        <button class="btn btn-sm btn-primary" onclick="reloadHospitals()">Search</button>
      </div>
    </div>
    <div class="hospital-list" id="hospital-list">
      <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">
        <div class="map-spinner" style="margin:0 auto 12px;"></div>
        Detecting your location…
      </div>
    </div>
  </aside>

  <!-- Map -->
  <div style="position:relative;">
    <div id="map-loading" class="map-loading">
      <div class="map-spinner"></div>
      <span>Getting your location…</span>
    </div>
    <div id="map"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/app.js"></script>
<script src="/js/hospitals.js"></script>
</body>
</html>
